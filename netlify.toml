[build]
  # The phone app is plain static files - Netlify only has to copy them.
  publish = "web"
  command = ""

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.json"
  [headers.values]
    Cache-Control = "no-cache"
